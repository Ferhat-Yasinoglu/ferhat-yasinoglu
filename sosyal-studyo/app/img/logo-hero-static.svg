    </linearGradient>
    <linearGradient id="hgReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <mask id="hmReflect"><rect x="415" y="558" width="597" height="150" fill="url(#hgReflect)"/></mask>
    <filter id="hblurR" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="hglowXL" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>

