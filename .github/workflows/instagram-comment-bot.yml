# instagram-comment-bot's tests. It lives here rather than next to the project
# because GitHub only reads workflows from .github/workflows at the repository
# root — a copy inside instagram-comment-bot/ is never run.
name: instagram-comment-bot testleri

on:
  push:
    branches: [main]
    paths:
      - "instagram-comment-bot/**"
      - ".github/workflows/instagram-comment-bot.yml"
  pull_request:
    paths:
      - "instagram-comment-bot/**"
      - ".github/workflows/instagram-comment-bot.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: instagram-comment-bot

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # The lockfile is not at the root, so the cache has to be pointed at it.
          cache-dependency-path: instagram-comment-bot/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
