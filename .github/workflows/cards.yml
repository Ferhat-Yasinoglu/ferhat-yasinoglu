name: Kartlari yenile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/cards.yml"
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/cards.yml"

jobs:
  # Uretici ornek veriyle calistirilir: kartlar string birlestirilerek
  # uretildigi icin bozuk bir SVG ancak calistirinca ortaya cikiyor.
  dogrula:
    name: Uretici
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ornek veriyle kartlari uret
        run: node .github/scripts/cards.mjs --mock --out "$RUNNER_TEMP/kartlar"

      - name: Uretilen SVG'leri dogrula
        run: python3 .github/scripts/check-cards.py "$RUNNER_TEMP/kartlar"

  cards:
    name: Kartlar
    needs: dogrula
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Kartlari uret
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node .github/scripts/cards.mjs

      # Uretici yalnizca icerigi degisen karti yeniden yaziyor; bu adim da
      # ancak oyle bir kart varsa commit atiyor. Alti saatte bir, sirf zaman
      # damgasi degisti diye commit atilmasin diye.
      - name: Degisiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "kartlarda degisiklik yok"
          else
            degisen=$(git diff --staged --name-only | xargs -n1 basename | paste -sd, | sed 's/,/, /g')
            git commit -m "Kartlari yenile: $degisen [skip ci]"
            git push
          fi
