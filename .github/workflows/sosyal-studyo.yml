# Sosyal Stüdyo'nun testleri.
#
# Yayın burada değil: GitHub Pages bir depoda tek bir site yayınladığı için
# dağıtım site.yml'de toplandı (bu proje + shafa aynı artefaktta). main'e giren
# kodu da orası test ediyor, bu yüzden burada push tetikleyicisi yok.
name: Sosyal Studyo

on:
  pull_request:
    paths:
      - "sosyal-studyo/**"
      - ".github/workflows/sosyal-studyo.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: sosyal-studyo

jobs:
  dogrula:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sosyal-studyo/package-lock.json
      - run: npm ci
      - run: npm run kontrol
      - run: npm test
