# reply-bot'u Fly.io'ya dağıtır — elle tetiklenir.
#
# Neden CI'dan: burada Docker imajı Fly'ın uzak kurucusunda kuruluyor
# (--remote-only), yani senin makinende Docker olmasına gerek yok. Tek gereken
# depo gizli değerlerinde bir FLY_API_TOKEN.
#
# Gizli değerler tarayıcıdan giriliyor (Settings → Secrets and variables →
# Actions), yani hiçbir token bir sohbete ya da depoya yazılmıyor:
#
#   FLY_API_TOKEN       zorunlu — organizasyon kapsamlı token (`fly tokens create org`
#                       ya da Fly panelindeki org/personal token sayfası).
#                       Uygulamaya özel "deploy token" burada YETMEZ: bu iş akışı
#                       gerekirse uygulamayı ve diski kendisi oluşturuyor, deploy
#                       token'ı ise yalnızca var olan tek bir uygulamaya dağıtabilir.
#                       Değeri kopyalarken baştaki "FlyV1 " kısmını da al —
#                       token'ın içinde boşluk vardır ve eksik kopyalanınca
#                       "You must be authenticated" hatası verir.
#   IG_ACCESS_TOKEN     Instagram kanalı için
#   IG_USER_ID
#   IG_VERIFY_TOKEN
#   IG_APP_SECRET
#   WA_ACCESS_TOKEN     WhatsApp kanalı için
#   WA_PHONE_NUMBER_ID
#   WA_VERIFY_TOKEN
#   WA_APP_SECRET
#   ANTHROPIC_API_KEY   model katmanı (isteğe bağlı)
#   BOT_PERSONA         model katmanı (isteğe bağlı)
#   PANEL_PASSWORD      web paneli (isteğe bağlı, en az 12 karakter)
#
# Verilmeyen gizli değer Fly'a hiç gönderilmez; o kanal kapalı kalır.
#
# PANEL_PASSWORD verirsen kanal değerlerini buraya hiç girmeden de dağıtabilirsin:
# makine boş açılır, geri kalanını /panel adresinden tarayıcıdan doldurursun.
# O yüzden aşağıda kalıcı disk oluşturuluyor — panelden yazılan ayarlar orada
# durur; olmazsa makine her yeniden başladığında hepsi silinir.
name: reply-bot dağıt

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Fly uygulama adı (küresel olarak benzersiz olmalı)"
        type: string
        default: reply-bot
      region:
        description: "Fly bölgesi (kalıcı disk burada oluşturulur)"
        type: string
        default: fra
      dry_run:
        description: "Prova: kararları logla, hiçbir şey gönderme"
        type: boolean
        default: true

# İki dağıtım aynı anda çalışmasın; ikincisi birincisini beklesin.
concurrency:
  group: deploy-reply-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reply-bot

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reply-bot/package-lock.json

      # Kırık bir sürümü dağıtmanın anlamı yok: testler önce.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: FLY_API_TOKEN var mı
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN yok. Fly'da organizasyon kapsamlı bir token üret"
            echo "::error::('fly tokens create org' ya da paneldeki org token sayfası),"
            echo "::error::sonra Settings → Secrets and variables → Actions altına ekle."
            exit 1
          fi

      # Kural dosyası gitignore'da (fiyat, link gibi sık düzenlenen şeyler
      # taşıdığı için). İmaja giren kurallar bu depodaki örnek dosya.
      - name: Kuralları hazırla
        run: cp rules.example.json rules.json

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Uygulama yoksa oluştur
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app_name }}
        run: |
          if flyctl status --app "$APP" >/dev/null 2>&1; then
            echo "$APP zaten var."
            exit 0
          fi

          echo "$APP oluşturuluyor…"
          # Çıktı yakalanıyor: flyctl bu adımda yetki sorununu ham bir GraphQL
          # hatası olarak yazıyor ve "organizations query failed" satırından
          # sebebi çıkarmak kolay değil. Yakalayıp tercümesini bırakıyoruz.
          if ! output=$(flyctl apps create "$APP" --org personal 2>&1); then
            echo "$output"
            case "$output" in
              *"must be authenticated"*|*"Unauthorized"*|*"not authorized"*)
                echo "::error::Fly token'ı reddetti. İki bilinen sebep:"
                echo "::error::1) Token uygulamaya özel bir 'deploy token'. Bu iş akışı uygulamayı"
                echo "::error::   ve diski kendisi oluşturuyor, bunun için organizasyon kapsamlı"
                echo "::error::   bir token gerekiyor ('fly tokens create org')."
                echo "::error::2) Token eksik kopyalanmış. Fly token'ları 'FlyV1 ' ile başlar ve"
                echo "::error::   içinde boşluk vardır; baştaki kısım atlanınca da bu hata çıkar."
                ;;
              *"already been taken"*|*"not available"*|*"taken"*)
                echo "::error::'$APP' adı Fly'da kullanılıyor. Ad küresel olarak benzersiz olmalı;"
                echo "::error::iş akışını başka bir adla çalıştır (ör. $APP-2)."
                ;;
            esac
            exit 1
          fi
          echo "$output"

      # fly.toml bu diski bağlıyor; yoksa dağıtım başlamadan durur. Panelden
      # girilen ayarlar burada yaşıyor, makinenin kendi diskinde değil.
      - name: Kalıcı disk yoksa oluştur
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app_name }}
          REGION: ${{ inputs.region }}
        run: |
          if flyctl volumes list --app "$APP" 2>/dev/null | grep -q botdata; then
            echo "botdata zaten var."
          else
            echo "botdata oluşturuluyor ($REGION)…"
            flyctl volumes create botdata --app "$APP" --region "$REGION" --size 1 --yes
          fi

      # Gizli değerler --stage ile konur: her biri tek başına bir dağıtım
      # tetiklemesin, hepsi aşağıdaki tek dağıtımla birlikte yürürlüğe girsin.
      - name: Gizli değerleri gönder
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app_name }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_VERIFY_TOKEN: ${{ secrets.IG_VERIFY_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_PERSONA: ${{ secrets.BOT_PERSONA }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -n "$PANEL_PASSWORD" ] && [ ${#PANEL_PASSWORD} -lt 12 ]; then
            echo "::error::PANEL_PASSWORD en az 12 karakter olmalı; panel token'ları tutuyor."
            exit 1
          fi

          args=()
          names=()
          for name in IG_ACCESS_TOKEN IG_USER_ID IG_VERIFY_TOKEN IG_APP_SECRET \
                      WA_ACCESS_TOKEN WA_PHONE_NUMBER_ID WA_VERIFY_TOKEN WA_APP_SECRET \
                      ANTHROPIC_API_KEY BOT_PERSONA PANEL_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              args+=("$name=$value")
              names+=("$name")
            fi
          done

          if [ "$DRY_RUN" = "true" ]; then
            args+=("BOT_DRY_RUN=1")
            names+=("BOT_DRY_RUN")
          fi

          if [ ${#args[@]} -eq 0 ]; then
            echo "::warning::Hiçbir gizli değer verilmemiş; bot açılışta duracak."
          elif [ ${#args[@]} -eq 1 ] && [ "${names[0]}" = "PANEL_PASSWORD" ]; then
            echo "Yalnızca panel şifresi gönderiliyor — kanallar /panel adresinden doldurulacak."
            flyctl secrets set --stage --app "$APP" "${args[@]}"
          else
            # Adlar ayrı toplanıyor: args'ı ayrıştırmak, çok satırlı bir değerin
            # (BOT_PERSONA) ikinci satırını isim sanıp loga yazdırırdı.
            echo "Gönderilen: ${names[*]}"
            flyctl secrets set --stage --app "$APP" "${args[@]}"
          fi

          if [ "$DRY_RUN" != "true" ]; then
            flyctl secrets unset --stage --app "$APP" BOT_DRY_RUN 2>/dev/null || true
          fi

      - name: Dağıt
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app_name }}
        run: flyctl deploy --remote-only --app "$APP"

      - name: Adres ve sağlık
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app_name }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
        run: |
          url="https://$APP.fly.dev"
          echo "### Dağıtıldı" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Adres: $url" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PANEL_PASSWORD" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Panel: $url/panel — gerisini buradan doldurabilirsin." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Meta paneline:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "instagram  $url/webhook/instagram   alan: comments" >> "$GITHUB_STEP_SUMMARY"
          echo "whatsapp   $url/webhook/whatsapp    alan: messages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          # Makinenin gerçekten cevap verdiğini görelim; vermiyorsa iş kırmızı olsun.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "$url/healthz"; then
              echo ""
              echo "healthz cevap verdi."
              exit 0
            fi
            echo "healthz henüz cevap vermiyor, tekrar denenecek ($attempt/6)…"
            sleep 10
          done
          echo "::error::Dağıtım bitti ama $url/healthz cevap vermiyor. 'fly logs --app $APP' ile bak."
          exit 1
