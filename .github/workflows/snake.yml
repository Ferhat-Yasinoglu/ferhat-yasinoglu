name: Yilan animasyonunu uret

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Katki grafiginden yilan animasyonu uret
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Renkler Seyir paletinden (void, kopuk, altin merdiveni). color_dots
          # bes deger aliyor: bos kare, sonra dort yogunluk seviyesi. Altin
          # veriyi tasiyor; yilan koyu temada kopuk, acik temada void kaliyor
          # ki en parlak karelerin uzerinde kaybolmasin.
          # '#' YAML'de yorum baslatir, bu yuzden %23 olarak yaziliyor.
          outputs: |
            dist/github-snake.svg?color_snake=%23040405&color_dots=%23efe6cf,%23e3c98a,%23d4a840,%238c6a1e,%236b4a12
            dist/github-snake-dark.svg?color_snake=%23f7f0df&color_dots=%23111013,%233a2f17,%238c6a1e,%23d4a840,%23ffd36e

      - name: output dalina yayinla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
