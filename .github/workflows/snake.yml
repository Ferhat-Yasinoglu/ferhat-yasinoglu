name: Yilan animasyonunu uret

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Katki grafiginden yilan animasyonu uret
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23f5d76e&color_dots=%23171003,%234a3708,%238c6a14,%23d4af37,%23ffe27a
            dist/github-snake-dark.svg?color_snake=%23f5d76e&color_dots=%23120d05,%234a3708,%238c6a14,%23d4af37,%23ffe27a

      - name: output dalina yayinla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
