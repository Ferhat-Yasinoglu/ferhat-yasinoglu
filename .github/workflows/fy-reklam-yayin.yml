# FY Reklam uygulamasını Cloudflare Pages'e yayınlar: https://fy-reklam.pages.dev
# main'e fy-reklam/ altında her push'ta önce denetim ve testler, geçerse yayın.
# Gerekli secret'lar: CLOUDFLARE_API_TOKEN (Pages: Edit), CLOUDFLARE_ACCOUNT_ID. Yoksa testler koşar, yayın uyarı verip atlanır.
# Kendi deposuna taşınınca `paths` ve `working-directory` kaldırılır (fy-merkez/.github/workflows/yayin.yml ile aynı kalıp).
name: FY Reklam yayin

on:
  push:
    branches: [main]
    paths:
      - "fy-reklam/app/**"
      - ".github/workflows/fy-reklam-yayin.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fy-reklam-yayin
  cancel-in-progress: false

defaults:
  run:
    working-directory: fy-reklam

jobs:
  yayinla:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.131.1
      WRANGLER_SEND_METRICS: "false"
      PROJE: fy-reklam
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fy-reklam/package-lock.json
      - run: npm ci
      - run: npm run kontrol
      - run: npm test
      # Sürüm damgası kısa SHA: service worker eski önbelleği buna göre siler.
      - name: Siteyi hazirla
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r app/. site/
          sed -i "s/__SURUM__/${GITHUB_SHA::7}/g" site/sw.js
          if grep -rl "__SURUM__" site; then echo "::error::site/ icinde __SURUM__ kaldi"; exit 1; fi
      - name: Dagit
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secret'i yok, yayin atlandi."
            exit 0
          fi
          npx --yes "$WRANGLER" pages project create "$PROJE" --production-branch main 2>&1 | tail -3 || true
          npx --yes "$WRANGLER" pages deploy site --project-name "$PROJE" --branch main --commit-dirty=true 2>&1 | tee dagit.log
          url="$(grep -o 'https://[a-z0-9.-]*\.pages\.dev' dagit.log | tail -1 || true)"
          {
            echo "### FY Reklam yayinlandi"
            echo "- Bu dagitim: ${url:-?}"
            echo "- Kalici adres: https://$PROJE.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
