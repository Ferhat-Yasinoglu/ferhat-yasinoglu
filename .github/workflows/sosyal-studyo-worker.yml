# Sosyal Stüdyo Worker dağıtımı — Cloudflare tarafındaki her şeyi bu iş yapar:
# secret'ları temizler/doğrular (Türkçe klavye bozmalarını düzeltir), D1 veritabanını bulur/oluşturur,
# göçleri uygular, Worker'ı dağıtır, secret'ları GitHub'dan Cloudflare'e taşır, Telegram token'ı varsa
# webhook'u kurar, sağlık kontrolü yapıp adresi özete yazar.
#
# GitHub → Settings → Secrets and variables → Actions:
#   Secrets (zorunlu): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, YONETICI_ANAHTARI (≥32 karakter)
#   Secrets (isteğe bağlı): TELEGRAM_BOT_TOKEN, META_APP_SECRET, META_VERIFY_TOKEN, IG_ACCESS_TOKEN,
#                           IG_USER_ID, WA_ACCESS_TOKEN, WA_PHONE_NUMBER_ID, ANTHROPIC_API_KEY
#   Variables: WORKER_DAGITIMI_ACIK = 1 (bu iş ancak o zaman çalışır), SS_PROVA = 0 (canlıya alınca)
name: Sosyal Studyo Worker

on:
  push:
    branches: [main]
    paths:
      - "sosyal-studyo/worker/**"
      - "sosyal-studyo/app/js/paylasilan/**"
      - "sosyal-studyo/tools/secretleri-duzelt.mjs"
      - ".github/workflows/sosyal-studyo-worker.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: sosyal-studyo

concurrency:
  group: sosyal-studyo-worker
  cancel-in-progress: false

jobs:
  dagit:
    name: Cloudflare
    runs-on: ubuntu-latest
    if: ${{ vars.WORKER_DAGITIMI_ACIK == '1' }}
    env:
      WRANGLER_SEND_METRICS: "false"
      TOML: worker/wrangler.toml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sosyal-studyo/package-lock.json
      - run: npm ci
      - run: npx vitest run worker/test

      # Temizlenmiş/düzeltilmiş değerler CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, YONETICI_ANAHTARI,
      # TELEGRAM_BOT_TOKEN adlarıyla $GITHUB_ENV üzerinden sonraki adımlara geçer (maskeli).
      - name: Secret'lari denetle ve duzelt
        env:
          HAM_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HAM_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAM_YONETICI_ANAHTARI: ${{ secrets.YONETICI_ANAHTARI }}
          HAM_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node tools/secretleri-duzelt.mjs

      - name: D1 veritabani (yoksa olustur)
        run: |
          npx wrangler whoami
          bul() { npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const l=JSON.parse(s);const v=l.find(x=>x.name==='sosyal-studyo');process.stdout.write(v?v.uuid:'')})"; }
          id="$(bul)"
          if [ -z "$id" ]; then
            echo "sosyal-studyo veritabani yok, olusturuluyor"
            npx wrangler d1 create sosyal-studyo
            id="$(bul)"
          fi
          [ -n "$id" ] || { echo "::error::D1 veritabani bulunamadi/olusturulamadi"; exit 1; }
          sed -i "s/D1_ID_BURAYA/$id/" "$TOML"
          grep -q "$id" "$TOML" && echo "D1 id yazildi"

      - name: Gocleri uygula
        run: npx wrangler d1 migrations apply sosyal-studyo --remote --config "$TOML"

      - name: Dagit
        id: dagit
        env:
          PROVA: ${{ vars.SS_PROVA || '1' }}
        run: |
          set -o pipefail
          npx wrangler deploy --config "$TOML" --var "SURUM:${GITHUB_SHA::7}" --var "PROVA:${PROVA}" 2>&1 | tee dagit.log
          url="$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' dagit.log | head -1 || true)"
          if [ -z "$url" ]; then
            alt="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).result?.subdomain||''))" || true)"
            [ -n "$alt" ] && url="https://sosyal-studyo.$alt.workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker adresi: ${url:-bulunamadi}"

      - name: Secret'lari Cloudflare'e yaz
        env:
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Telegram webhook gizli başlığı yönetici anahtarından türetilir: ayrı bir secret gerekmez, dağıtımlar arasında sabittir.
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            export TELEGRAM_WEBHOOK_SECRET="$(printf '%s' "$YONETICI_ANAHTARI:telegram-webhook" | sha256sum | cut -c1-48)"
          fi
          node -e '
            const adlar = ["YONETICI_ANAHTARI","TELEGRAM_BOT_TOKEN","TELEGRAM_WEBHOOK_SECRET","META_APP_SECRET","META_VERIFY_TOKEN","IG_ACCESS_TOKEN","IG_USER_ID","WA_ACCESS_TOKEN","WA_PHONE_NUMBER_ID","ANTHROPIC_API_KEY"];
            const s = {}; for (const a of adlar) if (process.env[a]) s[a] = process.env[a].trim();
            require("fs").writeFileSync("gizli.json", JSON.stringify(s));
            console.log("yazilacak secretlar:", Object.keys(s).join(", "));
          '
          npx wrangler secret bulk gizli.json --config "$TOML"
          rm -f gizli.json

      - name: Telegram webhook'u kur
        if: ${{ steps.dagit.outputs.url != '' }}
        env:
          URL: ${{ steps.dagit.outputs.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "TELEGRAM_BOT_TOKEN yok, webhook atlandi"; exit 0; fi
          sleep 5
          curl -fsS -X POST "$URL/api/kanal/telegram/kur" \
            -H "Authorization: Bearer $YONETICI_ANAHTARI" -H "X-SS-Sema: 1" -H "Content-Type: application/json" -d '{}' \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(r.ok?"Telegram webhook kuruldu: @"+r.veri.bot.username:"HATA: "+r.mesaj)})'

      - name: Saglik ve ozet
        if: ${{ always() && steps.dagit.outputs.url != '' }}
        env:
          URL: ${{ steps.dagit.outputs.url }}
        run: |
          kod="$(curl -sS -o saglik.json -w '%{http_code}' "$URL/health" || echo 000)"
          saglik="$(cat saglik.json 2>/dev/null | head -c 2000)"; rm -f saglik.json
          echo "HTTP $kod"; echo "$saglik"
          [ "$kod" = 200 ] || echo "::warning::/health $kod dondu: $saglik"
          {
            echo "## Sosyal Stüdyo Worker"
            echo
            echo "**Adres:** \`$URL\`"
            echo
            echo "Uygulamada **Ayarlar → Worker** ekranına bu adresi ve YONETICI_ANAHTARI değerini gir, \"Bağlan / doğrula\" de."
            echo
            echo '```json'
            echo "$saglik"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
