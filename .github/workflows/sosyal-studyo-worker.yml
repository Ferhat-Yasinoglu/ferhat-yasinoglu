# Sosyal Stüdyo Worker dağıtımı. Çalışması için GitHub secret'ları: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# wrangler.toml'daki D1 id yer tutucu kaldıysa dağıtım düşer — önce `wrangler d1 create` (worker/README.md).
name: Sosyal Studyo Worker

on:
  push:
    branches: [main]
    paths:
      - "sosyal-studyo/worker/**"
      - "sosyal-studyo/app/js/paylasilan/**"
      - ".github/workflows/sosyal-studyo-worker.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: sosyal-studyo

jobs:
  dagit:
    name: Cloudflare
    runs-on: ubuntu-latest
    if: ${{ vars.WORKER_DAGITIMI_ACIK == '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sosyal-studyo/package-lock.json
      - run: npm ci
      - run: npx vitest run worker/test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: sosyal-studyo/worker
          preCommands: npx wrangler d1 migrations apply sosyal-studyo --remote
          command: deploy --var SURUM:${{ github.sha }}
      - name: Saglik
        run: |
          url="$(npx wrangler deployments list --config worker/wrangler.toml 2>/dev/null | grep -o 'https://[^ ]*workers.dev' | head -1 || true)"
          if [ -n "$url" ]; then curl -fsS "$url/health"; else echo "adres bulunamadi, saglik atlandi"; fi
