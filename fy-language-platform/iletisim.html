<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kursla İletişim · FY Language Platform</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site">
  <header class="site-top">
    <a class="brand-mark" href="index.html">FY<small>Language Platform</small></a>
    <a class="btn btn-sm" href="index.html">Ana Sayfa</a>
  </header>

  <main class="sheet">
    <div>
      <p class="eyebrow">Kurs Ara · Kayıt · Soru</p>
      <h1>Kursla İletişim</h1>
    </div>
    <p class="lead">Mesajınız doğrudan seçtiğiniz kursa iletilir. Kurs sizi e-posta ile ya da verdiğiniz numaradan arar.</p>

    <form onsubmit="return false">
      <div class="field">
        <label for="ad">İsim</label>
        <input id="ad" type="text" placeholder="Adınız ve soyadınız">
      </div>
      <div class="field">
        <label for="eposta">E-posta</label>
        <input id="eposta" type="email" placeholder="ornek@eposta.com">
      </div>
      <div class="field">
        <label for="kurs">Kurs</label>
        <select id="kurs">
          <option>Kunduz Dil Akademisi — Kunduz</option>
          <option>Herat Lingua — Herat</option>
          <option>Kabil Dil Merkezi — Kabil</option>
          <option>Balkh Language House — Mezar-ı Şerif</option>
        </select>
      </div>
      <div class="field">
        <label for="mesaj">Mesaj</label>
        <textarea id="mesaj" placeholder="Hangi dili, hangi seviyede öğrenmek istiyorsunuz? Ders günleri konusunda bir tercihiniz var mı?"></textarea>
      </div>
      <div>
        <button class="btn btn-solid" type="submit">Gönder</button>
      </div>
    </form>
  </main>

  <footer class="site-foot">
    <span>FY Language Platform 2026</span>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="#">Kurs Ara</a>
      <a href="#">Hakkında</a>
    </nav>
  </footer>
</div>
<div class="draft-tag">Taslak · görünüm</div>
</body>
</html>
