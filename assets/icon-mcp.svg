<svg xmlns="http://www.w3.org/2000/svg" width="92" height="108" viewBox="0 0 92 108" role="img" aria-label="MCP">
  <defs>
    
    <linearGradient id="tbg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18" />
      <stop offset="0.16" stop-color="#2472ab" stop-opacity="1" />
      <stop offset="1" stop-color="#1b968e" stop-opacity="1" />
    </linearGradient>
    <filter id="h" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <style>
      .kutu { fill: url(#tbg); stroke: #eaf6fb; stroke-opacity: .3; stroke-width: 1; }
      .etk { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #f2f9ff; }
      /* Hareket bilincli sekilde hafif: sayfada baska seyler de oynuyor,
         ikonlar dikkati calmadan yasiyor olsun. */
      .bob { animation: bob 5s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
      .nabiz { animation: nabiz 4.5s ease-in-out infinite; }
      @keyframes nabiz { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .sallan { animation: sallan 5s ease-in-out infinite; }
      @keyframes sallan { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      .don { animation: don 22s linear infinite; }
      @keyframes don { to { transform: rotate(360deg); } }
      .alev { animation: alev 3s ease-in-out infinite; }
      @keyframes alev {
        0%,100% { transform: scale(1) rotate(-1.5deg); }
        50% { transform: scale(1.05) rotate(1.5deg); }
      }
      .isik { animation: isik 4.5s ease-in-out infinite; }
      @keyframes isik { 0%,100% { opacity: .05; } 50% { opacity: .14; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; }
      }
    </style>
  </defs>
  <rect class="kutu" x="3" y="3" width="86" height="102" rx="18" />
  <g transform="translate(46 40)">
    <circle class="isik" r="24" fill="#dbdbdb" filter="url(#h)" opacity=".1" />
    <g class="bob">
      <g class="don">
        <g transform="translate(-20 -20) scale(1.6667)">
          <path d="M13.85 0a4.16 4.16 0 0 0-2.95 1.217L1.456 10.66a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l9.442-9.442a2.49 2.49 0 0 1 3.541 0 2.49 2.49 0 0 1 0 3.541L8.59 12.97l-.1.1a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l.1-.098 7.03-7.034a2.49 2.49 0 0 1 3.542 0l.049.05a2.49 2.49 0 0 1 0 3.54l-8.54 8.54a1.96 1.96 0 0 0 0 2.755l1.753 1.753a.835.835 0 0 0 1.18 0 .835.835 0 0 0 0-1.18l-1.753-1.753a.266.266 0 0 1 0-.394l8.54-8.54a4.185 4.185 0 0 0 0-5.9l-.05-.05a4.16 4.16 0 0 0-2.95-1.218c-.2 0-.401.02-.6.048a4.17 4.17 0 0 0-1.17-3.552A4.16 4.16 0 0 0 13.85 0m0 3.333a.84.84 0 0 0-.59.245L6.275 10.56a4.186 4.186 0 0 0 0 5.902 4.186 4.186 0 0 0 5.902 0L19.16 9.48a.835.835 0 0 0 0-1.18.835.835 0 0 0-1.18 0l-6.985 6.984a2.49 2.49 0 0 1-3.54 0 2.49 2.49 0 0 1 0-3.54l6.983-6.985a.835.835 0 0 0 0-1.18.84.84 0 0 0-.59-.245" fill="#dbdbdb" />
        </g>
      </g>
    </g>
  </g>
  <text class="etk" x="46" y="90" text-anchor="middle">MCP</text>
</svg>
