<svg xmlns="http://www.w3.org/2000/svg" width="500" height="320" viewBox="0 0 500 320" role="img" aria-label="Repositories: 3, Followers: 1, Stars: 3, Commits: 82, Pull Requests: 48, Contributions: 135">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .panel { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .etiket { font-size: 12px; fill: #4ade80; }
    .anahtar { font-size: 12.5px; fill: #6fbf78; }
    .deger { font-size: 12.5px; fill: #d4f5d6; }
    .kucuk { font-size: 11px; fill: #3d6b42; }
    .gir { animation: gir .6s ease-out backwards; }
    @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .yanip { animation: yanip 1.1s steps(1) infinite; }
    @keyframes yanip { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }</style></defs>
  <rect width="500" height="320" fill="#050a05" />
  
  <rect class="panel" x=".5" y=".5" width="499" height="319" rx="3" />
  <text class="etiket" x="14" y="21">&gt; git_status</text>
  <line x1="0" y1="28" x2="500" y2="28" stroke="#1e3a20" stroke-width="1" />
  
    <g class="gir" style="animation-delay:0.00s">
      <text class="anahtar" x="16" y="62" font-size="13">[]</text>
      <text class="anahtar" x="42" y="62">Repositories</text>
      <text class="deger" x="484" y="62" text-anchor="end"
            fill="#22ff88">3</text>
      <line x1="16" y1="74" x2="484" y2="74"
            stroke="#1e3a20" stroke-width=".8" stroke-dasharray="2 3" />
    </g>
    <g class="gir" style="animation-delay:0.07s">
      <text class="anahtar" x="16" y="104" font-size="13">&lt;&gt;</text>
      <text class="anahtar" x="42" y="104">Followers</text>
      <text class="deger" x="484" y="104" text-anchor="end"
            fill="#22ff88">1</text>
      <line x1="16" y1="116" x2="484" y2="116"
            stroke="#1e3a20" stroke-width=".8" stroke-dasharray="2 3" />
    </g>
    <g class="gir" style="animation-delay:0.14s">
      <text class="anahtar" x="16" y="146" font-size="13">*</text>
      <text class="anahtar" x="42" y="146">Stars</text>
      <text class="deger" x="484" y="146" text-anchor="end"
            fill="#22ff88">3</text>
      <line x1="16" y1="158" x2="484" y2="158"
            stroke="#1e3a20" stroke-width=".8" stroke-dasharray="2 3" />
    </g>
    <g class="gir" style="animation-delay:0.21s">
      <text class="anahtar" x="16" y="188" font-size="13">^</text>
      <text class="anahtar" x="42" y="188">Commits</text>
      <text class="deger" x="484" y="188" text-anchor="end"
            fill="#22ff88">82</text>
      <line x1="16" y1="200" x2="484" y2="200"
            stroke="#1e3a20" stroke-width=".8" stroke-dasharray="2 3" />
    </g>
    <g class="gir" style="animation-delay:0.28s">
      <text class="anahtar" x="16" y="230" font-size="13">%</text>
      <text class="anahtar" x="42" y="230">Pull Requests</text>
      <text class="deger" x="484" y="230" text-anchor="end"
            fill="#22ff88">48</text>
      <line x1="16" y1="242" x2="484" y2="242"
            stroke="#1e3a20" stroke-width=".8" stroke-dasharray="2 3" />
    </g>
    <g class="gir" style="animation-delay:0.35s">
      <text class="anahtar" x="16" y="272" font-size="13">+</text>
      <text class="anahtar" x="42" y="272">Contributions</text>
      <text class="deger" x="484" y="272" text-anchor="end"
            fill="#22ff88">135</text>
      <line x1="16" y1="284" x2="484" y2="284"
            stroke="#1e3a20" stroke-width=".8" stroke-dasharray="2 3" />
    </g>
</svg>
