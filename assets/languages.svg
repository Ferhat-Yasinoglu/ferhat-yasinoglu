<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="190" viewBox="0 0 480 190" role="img" aria-label="Most used languages">
  <defs>
    
    <pattern id="dizg" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#d4af37" stroke-opacity=".06" stroke-width="1" />
    </pattern>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: #070604; stroke: #d4af37; stroke-opacity: .3; stroke-width: 1; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .title { font-size: 16px; font-weight: 700; fill: #f4ecd8; }
      .lg { font-size: 13px; fill: #f4ecd8; }
      .pc { font-size: 13px; fill: #9b8f72; font-variant-numeric: tabular-nums; }
      .seg { transform-box: fill-box; transform-origin: left center; animation: wipe .9s cubic-bezier(.2,.7,.3,1) backwards; }
      @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .dugum { animation: dugum 3.4s ease-in-out infinite; }
      @keyframes dugum { 0%,100% { fill-opacity: .45; } 50% { fill-opacity: 1; } }
    </style>
  </defs>
  
  <rect class="card-bg" width="480" height="190" rx="4" />
  <rect width="480" height="190" rx="4" fill="url(#dizg)" />
  <path d="M0 34 H22" stroke="#d4af37" stroke-opacity=".32" stroke-width="1.4" fill="none" />
  <rect class="dugum" x="24" y="30" width="8" height="8" fill="#d4af37" />
  <text class="title" x="44" y="39">Most used languages</text>
  <path d="M0 77 H30 M450 77 H480" stroke="#d4af37" stroke-opacity=".3" stroke-width="1.4" fill="none" />
  <rect x="31" y="73" width="7" height="7" fill="#d4af37" fill-opacity=".55" />
  <rect x="442" y="73" width="7" height="7" fill="#d4af37" fill-opacity=".55" />
  
    <rect x="40.0" y="72" width="221.0" height="10"
          fill="#e34e29" class="seg" style="animation-delay:0.15s" />
    <rect x="264.0" y="72" width="105.5" height="10"
          fill="#f1e05a" class="seg" style="animation-delay:0.26s" />
    <rect x="372.4" y="72" width="34.0" height="10"
          fill="#b79fcf" class="seg" style="animation-delay:0.37s" />
    <rect x="409.5" y="72" width="24.3" height="10"
          fill="#4e8bce" class="seg" style="animation-delay:0.48s" />
    <rect x="436.7" y="72" width="2.0" height="10"
          fill="#b8c2d0" class="seg" style="animation-delay:0.59s" />
    <rect x="441.7" y="72" width="2.0" height="10"
          fill="#a6afb3" class="seg" style="animation-delay:0.70s" />
  
    <g class="rise" style="animation-delay:0.35s">
      <rect x="40" y="111" width="8" height="8" fill="#e34e29" />
      <text class="lg" x="58" y="120">HTML</text>
      <text class="pc" x="226" y="120" text-anchor="end">57.4%</text>
    </g>
    <g class="rise" style="animation-delay:0.43s">
      <rect x="250" y="111" width="8" height="8" fill="#f1e05a" />
      <text class="lg" x="268" y="120">JavaScript</text>
      <text class="pc" x="436" y="120" text-anchor="end">27.4%</text>
    </g>
    <g class="rise" style="animation-delay:0.51s">
      <rect x="40" y="137" width="8" height="8" fill="#b79fcf" />
      <text class="lg" x="58" y="146">CSS</text>
      <text class="pc" x="226" y="146" text-anchor="end">8.8%</text>
    </g>
    <g class="rise" style="animation-delay:0.59s">
      <rect x="250" y="137" width="8" height="8" fill="#4e8bce" />
      <text class="lg" x="268" y="146">TypeScript</text>
      <text class="pc" x="436" y="146" text-anchor="end">6.3%</text>
    </g>
    <g class="rise" style="animation-delay:0.67s">
      <rect x="40" y="163" width="8" height="8" fill="#b8c2d0" />
      <text class="lg" x="58" y="172">PowerShell</text>
      <text class="pc" x="226" y="172" text-anchor="end">0.1%</text>
    </g>
    <g class="rise" style="animation-delay:0.75s">
      <rect x="250" y="163" width="8" height="8" fill="#a6afb3" />
      <text class="lg" x="268" y="172">Dockerfile</text>
      <text class="pc" x="436" y="172" text-anchor="end">0.0%</text>
    </g>
</svg>
