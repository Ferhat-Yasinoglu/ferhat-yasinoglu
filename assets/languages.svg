<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-label="En çok kullanılan diller">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#24283b" />
    </linearGradient>
    <clipPath id="barclip"><rect x="28" y="70" width="424" height="12" rx="6" /></clipPath>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: url(#bg); stroke: #2f334d; stroke-width: 1; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rise { animation-duration: .01ms; opacity: 1; }
    }
      .title { font-size: 16px; font-weight: 700; fill: #c0caf5; }
      .lg { font-size: 13px; fill: #c0caf5; }
      .pc { font-size: 13px; fill: #7982a9; font-variant-numeric: tabular-nums; }
      .seg { transform-box: fill-box; transform-origin: left center; animation: wipe .9s cubic-bezier(.2,.7,.3,1) backwards; }
      @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .spin { animation: spin 6s linear infinite; transform-origin: 30px 34px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect class="card-bg" width="480" height="190" rx="14" />
  <circle class="spin" cx="30" cy="34" r="4.5" fill="none" stroke="#bf91f3" stroke-width="2"
          stroke-dasharray="14 8" />
  <text class="title" x="46" y="39">🎨 En çok kullandığım diller</text>
  <g clip-path="url(#barclip)">
    <rect x="28.0" y="70" width="262.9" height="12"
          fill="#f1e05a" class="seg" style="animation-delay:0.15s" />
    <rect x="290.9" y="70" width="101.8" height="12"
          fill="#e34c26" class="seg" style="animation-delay:0.26s" />
    <rect x="392.6" y="70" width="50.9" height="12"
          fill="#563d7c" class="seg" style="animation-delay:0.37s" />
    <rect x="443.5" y="70" width="8.5" height="12"
          fill="#89e051" class="seg" style="animation-delay:0.48s" /></g>
  
    <g class="rise" style="animation-delay:0.35s">
      <circle cx="35" cy="114" r="5" fill="#f1e05a" />
      <text class="lg" x="48" y="118">JavaScript</text>
      <text class="pc" x="230" y="118" text-anchor="end">62.0%</text>
    </g>
    <g class="rise" style="animation-delay:0.43s">
      <circle cx="261" cy="114" r="5" fill="#e34c26" />
      <text class="lg" x="274" y="118">HTML</text>
      <text class="pc" x="456" y="118" text-anchor="end">24.0%</text>
    </g>
    <g class="rise" style="animation-delay:0.51s">
      <circle cx="35" cy="140" r="5" fill="#563d7c" />
      <text class="lg" x="48" y="144">CSS</text>
      <text class="pc" x="230" y="144" text-anchor="end">12.0%</text>
    </g>
    <g class="rise" style="animation-delay:0.59s">
      <circle cx="261" cy="140" r="5" fill="#89e051" />
      <text class="lg" x="274" y="144">Shell</text>
      <text class="pc" x="456" y="144" text-anchor="end">2.0%</text>
    </g>
</svg>
