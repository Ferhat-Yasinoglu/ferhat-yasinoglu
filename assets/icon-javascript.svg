    <style>@font-face{font-family:FYMono;font-style:normal;font-weight:100 900;unicode-range:U+2c,U+2e,U+30-39,U+4a,U+53,U+61,U+63,U+69,U+70,U+72,U+74,U+76,U+b0,U+b7;src:url(data:font/woff2;base64,) format("woff2");}
  text { font-family: FYSans, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
