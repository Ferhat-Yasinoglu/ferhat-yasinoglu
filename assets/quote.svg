<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="BUILD IT TO UNDERSTAND IT - Ferhat Yasinoglu">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .panel { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .etiket { font-size: 12px; fill: #4ade80; }
    .anahtar { font-size: 12.5px; fill: #6fbf78; }
    .deger { font-size: 12.5px; fill: #d4f5d6; }
    .kucuk { font-size: 11px; fill: #3d6b42; }
    .gir { animation: gir .6s ease-out backwards; }
    @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .yanip { animation: yanip 1.1s steps(1) infinite; }
    @keyframes yanip { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }</style></defs>
  <rect width="1000" height="200" fill="#050a05" />
  
  <rect class="panel" x=".5" y=".5" width="999" height="199" rx="3" />
  <text class="etiket" x="14" y="21">&gt; terminal</text>
  <line x1="0" y1="28" x2="1000" y2="28" stroke="#1e3a20" stroke-width="1" />
  <circle cx="938" cy="17" r="5" fill="none" stroke="#3d6b42" stroke-width="1.2" /><circle cx="956" cy="17" r="5" fill="none" stroke="#3d6b42" stroke-width="1.2" /><circle cx="974" cy="17" r="5" fill="none" stroke="#f472b6" stroke-width="1.2" />
    <text x="500" y="86" text-anchor="middle" font-size="22"
          letter-spacing="1.5" fill="#22ff88" opacity=".92">BUILD IT</text>
    <text x="500" y="120" text-anchor="middle" font-size="22"
          letter-spacing="1.5" fill="#22ff88" opacity=".92">TO UNDERSTAND IT</text>
  <text class="anahtar" x="984" y="158"
        text-anchor="end" font-size="13">- Ferhat Yasinoglu</text>
  <text class="etiket" x="16" y="184" font-size="12">ferhat@github:~$ always_building.sh <tspan class="yanip">_</tspan></text>
</svg>
