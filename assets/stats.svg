<svg xmlns="http://www.w3.org/2000/svg" width="480" height="190" viewBox="0 0 480 190" role="img" aria-label="GitHub statistics">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18" />
      <stop offset="0.16" stop-color="#2472ab" stop-opacity="1" />
      <stop offset="1" stop-color="#1b968e" stop-opacity="1" />
    </linearGradient>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: url(#bg); stroke: #eaf6fb; stroke-opacity: .32; stroke-width: 1.2; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .title { font-size: 16px; font-weight: 700; fill: #f2f9ff; }
      .num { font-size: 25px; font-weight: 800; }
      .lbl { font-size: 12px; fill: #cbe4ee; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .45; r: 4; } 50% { opacity: 1; r: 5.5; } }
    </style>
  </defs>
  <rect class="card-bg" width="480" height="190" rx="14" />
  <circle class="pulse" cx="30" cy="34" r="4" fill="#c5efa2" />
  <text class="title" x="46" y="39">📊 GitHub Statistics</text>
  
    <g class="rise" style="animation-delay:0.12s">
      <rect x="28" y="52" width="3" height="40" rx="1.5" fill="#a9d3ff" />
      <text class="num" x="42" y="78" fill="#a9d3ff">43</text>
      <text class="lbl" x="42" y="96">Contributions</text>
    </g>
    <g class="rise" style="animation-delay:0.21s">
      <rect x="176" y="52" width="3" height="40" rx="1.5" fill="#c5efa2" />
      <text class="num" x="190" y="78" fill="#c5efa2">34</text>
      <text class="lbl" x="190" y="96">Commits</text>
    </g>
    <g class="rise" style="animation-delay:0.30s">
      <rect x="324" y="52" width="3" height="40" rx="1.5" fill="#e3c9ff" />
      <text class="num" x="338" y="78" fill="#e3c9ff">2</text>
      <text class="lbl" x="338" y="96">Repositories</text>
    </g>
    <g class="rise" style="animation-delay:0.39s">
      <rect x="28" y="120" width="3" height="40" rx="1.5" fill="#ffe19a" />
      <text class="num" x="42" y="146" fill="#ffe19a">3</text>
      <text class="lbl" x="42" y="164">Stars</text>
    </g>
    <g class="rise" style="animation-delay:0.48s">
      <rect x="176" y="120" width="3" height="40" rx="1.5" fill="#a3f0ff" />
      <text class="num" x="190" y="146" fill="#a3f0ff">2</text>
      <text class="lbl" x="190" y="164">Followers</text>
    </g>
    <g class="rise" style="animation-delay:0.57s">
      <rect x="324" y="120" width="3" height="40" rx="1.5" fill="#ffbecb" />
      <text class="num" x="338" y="146" fill="#ffbecb">5</text>
      <text class="lbl" x="338" y="164">Pull requests</text>
    </g>
</svg>
