<svg xmlns="http://www.w3.org/2000/svg" width="92" height="104" viewBox="0 0 92 104" role="img" aria-label="HTML5">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .panel { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .etiket { font-size: 12px; fill: #4ade80; }
    .anahtar { font-size: 12.5px; fill: #6fbf78; }
    .deger { font-size: 12.5px; fill: #d4f5d6; }
    .kucuk { font-size: 11px; fill: #3d6b42; }
    .gir { animation: gir .6s ease-out backwards; }
    @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .yanip { animation: yanip 1.1s steps(1) infinite; }
    @keyframes yanip { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
    .kare { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .ad { font-size: 11px; fill: #6fbf78; }
    .suz { animation: suz 4.5s ease-in-out infinite alternate; }
    @keyframes suz { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
  </style></defs>
  <rect width="92" height="104" fill="#050a05" />
  <rect class="kare" x=".5" y=".5" width="91" height="82" rx="3" />
  <!-- Konumlandirma disardaki grupta, animasyon icerdekinde: CSS transform
       ayni ogedeki transform OZNITELIGINI tumuyle eziyor, ikisi bir arada
       olursa tarayicida logo olceksiz halde sol uste dusuyor. -->
  <g transform="translate(27 22) scale(1.5833333333333333)">
    <g class="suz"><path d="M1.5 0h21l-1.91 21.563L11.977 24l-8.564-2.438L1.5 0zm7.031 9.75l-.232-2.718 10.059.003.23-2.622L5.412 4.41l.698 8.01h9.126l-.326 3.426-2.91.804-2.955-.81-.188-2.11H6.248l.33 4.171L12 19.351l5.379-1.443.744-8.157H8.531z" fill="#E34F26" /></g>
  </g>
  <text class="ad" x="46" y="99" text-anchor="middle">HTML5</text>
</svg>
