<svg xmlns="http://www.w3.org/2000/svg" width="500" height="280" viewBox="0 0 500 280" role="img" aria-label="Toplam 141 katki, guncel seri 10 gun, en uzun seri 10 gun">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .panel { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .etiket { font-size: 12px; fill: #4ade80; }
    .anahtar { font-size: 12.5px; fill: #6fbf78; }
    .deger { font-size: 12.5px; fill: #d4f5d6; }
    .kucuk { font-size: 11px; fill: #3d6b42; }
    .gir { animation: gir .6s ease-out backwards; }
    @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .yanip { animation: yanip 1.1s steps(1) infinite; }
    @keyframes yanip { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }</style></defs>
  <rect width="500" height="280" fill="#050a05" />
  
  <rect class="panel" x=".5" y=".5" width="499" height="279" rx="3" />
  <text class="etiket" x="14" y="21">&gt; github_activity</text>
  <line x1="0" y1="28" x2="500" y2="28" stroke="#1e3a20" stroke-width="1" />
  
    <circle cx="116" cy="150" r="54" fill="none" stroke="#1e3a20" stroke-width="11" />
    <circle cx="116" cy="150" r="54" fill="none" stroke="#22c55e" stroke-width="11"
            stroke-linecap="round" transform="rotate(-90 116 150)"
            stroke-dasharray="339.3" stroke-dashoffset="324.5">
      <animate attributeName="stroke-dashoffset" from="339.3" to="324.5"
               dur="1.4s" fill="freeze" calcMode="spline" keySplines=".2 .7 .3 1" />
    </circle>
    <text x="116" y="148" text-anchor="middle" font-size="21" font-weight="700"
          fill="#22ff88">141</text>
    <text x="116" y="166" text-anchor="middle" class="kucuk">Toplam katki</text>
    <text x="116" y="230" text-anchor="middle" class="kucuk">gunlerin %4'inde aktif</text>
    
    <text class="anahtar" x="212" y="112">Current Streak</text>
    <text class="deger" x="484" y="112" text-anchor="end">10 gun</text>
    <text class="anahtar" x="212" y="136">Longest Streak</text>
    <text class="deger" x="484" y="136" text-anchor="end">10 gun</text>
    <text class="anahtar" x="212" y="160">Top Language</text>
    <text class="deger" x="484" y="160" text-anchor="end">JavaScript</text>
    <text class="anahtar" x="212" y="184">Aktif gun</text>
    <text class="deger" x="484" y="184" text-anchor="end">16</text>
</svg>
