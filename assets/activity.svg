<svg xmlns="http://www.w3.org/2000/svg" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="Contribution graph, last 90 days">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#24283b" />
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bf91f3" stop-opacity=".45" />
      <stop offset="100%" stop-color="#bf91f3" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd" />
      <stop offset="100%" stop-color="#bf91f3" />
    </linearGradient>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: url(#bg); stroke: #2f334d; stroke-width: 1; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .title { font-size: 21px; font-weight: 700; fill: #c0caf5; }
      .meta { font-size: 16px; fill: #7982a9; }
      .line { fill: none; stroke: url(#stroke); stroke-width: 2.5; stroke-linecap: round;
              animation: draw 2.6s .2s cubic-bezier(.4,0,.2,1) backwards; }
      @keyframes draw {
        from { stroke-dasharray: 4000; stroke-dashoffset: 4000; }
        to { stroke-dasharray: 4000; stroke-dashoffset: 0; }
      }
      .fill { animation: fade 1.2s 1.5s backwards; }
      .tip { animation: fade .6s 2.6s backwards; }
      .stamp { font-size: 14px; fill: #7982a9; animation: fade .8s 3s backwards; }
      .ping { animation: ping 2s ease-out infinite; transform-origin: center; }
      @keyframes ping { 0% { r: 4; opacity: .9; } 70%,100% { r: 13; opacity: 0; } }
    </style>
  </defs>
