<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="200" viewBox="0 0 820 200" role="img" aria-label="Contribution graph, last 90 days">
  <defs>
    
    <pattern id="aizg" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#d4af37" stroke-opacity=".06" stroke-width="1" />
    </pattern>
    <linearGradient id="aalan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity=".38" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ahat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9821e" />
      <stop offset="100%" stop-color="#f5d76e" />
    </linearGradient>
    <filter id="apar" x="-20%" y="-60%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: #070604; stroke: #d4af37; stroke-opacity: .3; stroke-width: 1; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .title { font-size: 21px; font-weight: 700; fill: #f4ecd8; }
      .meta { font-size: 16px; fill: #9b8f72; }
      .iz { fill: none; stroke: url(#ahat); stroke-width: 2.4; stroke-linecap: round;
            animation: draw 2.6s .2s cubic-bezier(.4,0,.2,1) backwards; }
      @keyframes draw {
        from { stroke-dasharray: 4000; stroke-dashoffset: 4000; }
        to { stroke-dasharray: 4000; stroke-dashoffset: 0; }
      }
      .dolgu { animation: fade 1.2s 1.5s backwards; }
      .uc { animation: fade .6s 2.6s backwards; }
      .stamp { font-size: 14px; fill: #9b8f72; animation: fade .8s 3s backwards; }
      .ping { animation: ping 2s ease-out infinite; transform-origin: center; }
      @keyframes ping { 0% { r: 4; opacity: .9; } 70%,100% { r: 13; opacity: 0; } }
      .dugum { animation: dugum 3.4s ease-in-out infinite; }
      @keyframes dugum { 0%,100% { fill-opacity: .45; } 50% { fill-opacity: 1; } }
    </style>
  </defs>
  
