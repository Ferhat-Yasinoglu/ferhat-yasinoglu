<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Ferhat Yasinoglu">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b27" />
      <stop offset="100%" stop-color="#24283b" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" />
    </filter>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd">
        <animate attributeName="stop-color" values="#70a5fd;#2ac3de;#bf91f3;#70a5fd" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#bf91f3">
        <animate attributeName="stop-color" values="#bf91f3;#70a5fd;#2ac3de;#bf91f3" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="200" rx="16" /></clipPath>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: url(#bg); stroke: #2f334d; stroke-width: 1; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .name { font-size: 46px; font-weight: 800; fill: url(#ink); letter-spacing: -.5px; }
      .tag { font-size: 17px; fill: #7982a9; letter-spacing: .3px; }
      .bar { animation: grow 1.1s .35s cubic-bezier(.2,.7,.3,1) backwards; }
      @keyframes grow { from { width: 0; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect class="card-bg" width="1000" height="200" rx="16" />
    
      <circle cx="160" cy="60" r="130" fill="#70a5fd" opacity=".16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 60 24; 0 0" dur="19s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".10;.22;.10" dur="9.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="820" cy="150" r="150" fill="#bf91f3" opacity=".16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -70 -30; 0 0" dur="23s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".10;.22;.10" dur="11.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="520" cy="30" r="110" fill="#2ac3de" opacity=".16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 40 40; 0 0" dur="27s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".10;.22;.10" dur="13.5s" repeatCount="indefinite" />
      </circle>
    <g class="rise" style="animation-delay:.05s">
      <text class="name" x="50" y="92">Ferhat Yasinoglu</text>
    </g>
    <rect class="bar" x="52" y="112" width="120" height="4" rx="2" fill="url(#ink)" />
    <g class="rise" style="animation-delay:.25s">
      <text class="tag" x="50" y="146">Web geliştirici · Firebase · PWA · sade JavaScript</text>
    </g>
  </g>
</svg>
