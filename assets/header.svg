<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Farhad Yaqoobi">
  <defs>
    
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18" />
      <stop offset="0.16" stop-color="#2472ab" stop-opacity="1" />
      <stop offset="1" stop-color="#1b968e" stop-opacity="1" />
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45" />
    </filter>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eafff9">
        <animate attributeName="stop-color" values="#eafff9;#ffffff;#d9ecff;#eafff9" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#d9ecff">
        <animate attributeName="stop-color" values="#d9ecff;#eafff9;#ffffff;#d9ecff" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="250" rx="16" /></clipPath>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: url(#bg); stroke: #eaf6fb; stroke-opacity: .32; stroke-width: 1.2; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .name { font-size: 60px; font-weight: 800; fill: url(#ink); letter-spacing: -1px; }
      .tag { font-size: 22px; fill: #cbe4ee; letter-spacing: .2px; }
      .bar { animation: grow 1.1s .35s cubic-bezier(.2,.7,.3,1) backwards; }
      @keyframes grow { from { width: 0; } }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect class="card-bg" width="1000" height="250" rx="16" />
    
      <circle cx="160" cy="60" r="130" fill="#a9d3ff" opacity=".16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 60 24; 0 0" dur="19s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".10;.22;.10" dur="9.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="820" cy="150" r="150" fill="#e3c9ff" opacity=".16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -70 -30; 0 0" dur="23s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".10;.22;.10" dur="11.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="520" cy="30" r="110" fill="#a3f0ff" opacity=".16" filter="url(#soft)">
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 40 40; 0 0" dur="27s" repeatCount="indefinite" />
        <animate attributeName="opacity" values=".10;.22;.10" dur="13.5s" repeatCount="indefinite" />
      </circle>
    <g class="rise" style="animation-delay:.05s">
      <text class="name" x="56" y="118">Farhad Yaqoobi</text>
    </g>
    <rect class="bar" x="58" y="142" width="150" height="5" rx="2.5" fill="url(#ink)" />
    <g class="rise" style="animation-delay:.25s">
      <text class="tag" x="56" y="186">Offline-first web apps · vanilla JavaScript · TypeScript bots</text>
    </g>
  </g>
</svg>
