<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="96" height="112" viewBox="0 0 96 112" role="img" aria-label="TypeScript">
<title>TypeScript</title>

  <defs>
    <linearGradient id="ig0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c9" /><stop offset=".45" stop-color="#ffd36e" /><stop offset="1" stop-color="#d4a840" />
    </linearGradient>
