<svg xmlns="http://www.w3.org/2000/svg" width="92" height="108" viewBox="0 0 92 108" role="img" aria-label="TypeScript">
  <defs>
    
    <linearGradient id="tbg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18" />
      <stop offset="0.16" stop-color="#2472ab" stop-opacity="1" />
      <stop offset="1" stop-color="#1b968e" stop-opacity="1" />
    </linearGradient>
    <filter id="h" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <style>
      .kutu { fill: url(#tbg); stroke: #eaf6fb; stroke-opacity: .3; stroke-width: 1; }
      .etk { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #f2f9ff; }
      /* Hareket bilincli sekilde hafif: sayfada baska seyler de oynuyor,
         ikonlar dikkati calmadan yasiyor olsun. */
      .bob { animation: bob 5s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
      .nabiz { animation: nabiz 4.5s ease-in-out infinite; }
      @keyframes nabiz { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .sallan { animation: sallan 5s ease-in-out infinite; }
      @keyframes sallan { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      .don { animation: don 22s linear infinite; }
      @keyframes don { to { transform: rotate(360deg); } }
      .alev { animation: alev 3s ease-in-out infinite; }
      @keyframes alev {
        0%,100% { transform: scale(1) rotate(-1.5deg); }
        50% { transform: scale(1.05) rotate(1.5deg); }
      }
      .isik { animation: isik 4.5s ease-in-out infinite; }
      @keyframes isik { 0%,100% { opacity: .05; } 50% { opacity: .14; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; }
      }
    </style>
  </defs>
  <rect class="kutu" x="3" y="3" width="86" height="102" rx="18" />
  <g transform="translate(46 40)">
    <circle class="isik" r="24" fill="#3178C6" filter="url(#h)" opacity=".1" />
    <g class="bob">
      <g class="nabiz">
        <g transform="translate(-20 -20) scale(1.6667)">
          <path d="M1.125 0C.502 0 0 .502 0 1.125v21.75C0 23.498.502 24 1.125 24h21.75c.623 0 1.125-.502 1.125-1.125V1.125C24 .502 23.498 0 22.875 0zm17.363 9.75c.612 0 1.154.037 1.627.111a6.38 6.38 0 0 1 1.306.34v2.458a3.95 3.95 0 0 0-.643-.361 5.093 5.093 0 0 0-.717-.26 5.453 5.453 0 0 0-1.426-.2c-.3 0-.573.028-.819.086a2.1 2.1 0 0 0-.623.242c-.17.104-.3.229-.393.374a.888.888 0 0 0-.14.49c0 .196.053.373.156.529.104.156.252.304.443.444s.423.276.696.41c.273.135.582.274.926.416.47.197.892.407 1.266.628.374.222.695.473.963.753.268.279.472.598.614.957.142.359.214.776.214 1.253 0 .657-.125 1.21-.373 1.656a3.033 3.033 0 0 1-1.012 1.085 4.38 4.38 0 0 1-1.487.596c-.566.12-1.163.18-1.79.18a9.916 9.916 0 0 1-1.84-.164 5.544 5.544 0 0 1-1.512-.493v-2.63a5.033 5.033 0 0 0 3.237 1.2c.333 0 .624-.03.872-.09.249-.06.456-.144.623-.25.166-.108.29-.234.373-.38a1.023 1.023 0 0 0-.074-1.089 2.12 2.12 0 0 0-.537-.5 5.597 5.597 0 0 0-.807-.444 27.72 27.72 0 0 0-1.007-.436c-.918-.383-1.602-.852-2.053-1.405-.45-.553-.676-1.222-.676-2.005 0-.614.123-1.141.369-1.582.246-.441.58-.804 1.004-1.089a4.494 4.494 0 0 1 1.47-.629 7.536 7.536 0 0 1 1.77-.201zm-15.113.188h9.563v2.166H9.506v9.646H6.789v-9.646H3.375z" fill="#3178C6" />
        </g>
      </g>
    </g>
  </g>
  <text class="etk" x="46" y="90" text-anchor="middle">TypeScript</text>
</svg>
