<svg xmlns="http://www.w3.org/2000/svg" width="92" height="104" viewBox="0 0 92 104" role="img" aria-label="TypeScript">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
