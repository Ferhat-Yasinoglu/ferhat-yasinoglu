    <style>@font-face{font-family:FYMono;font-style:normal;font-weight:100 900;unicode-range:U+2c,U+2e,U+30-39,U+54,U+61,U+65,U+67,U+6c-6d,U+72,U+b0,U+b7;src:url(data:font/woff2;base64,) format("woff2");}
