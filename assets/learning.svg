<svg xmlns="http://www.w3.org/2000/svg" width="500" height="260" viewBox="0 0 500 260" role="img" aria-label="React %70, Node.js %60, Firebase %80, Backend %65">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .panel { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .etiket { font-size: 12px; fill: #4ade80; }
    .anahtar { font-size: 12.5px; fill: #6fbf78; }
    .deger { font-size: 12.5px; fill: #d4f5d6; }
    .kucuk { font-size: 11px; fill: #3d6b42; }
    .gir { animation: gir .6s ease-out backwards; }
    @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .yanip { animation: yanip 1.1s steps(1) infinite; }
    @keyframes yanip { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }</style></defs>
  <rect width="500" height="260" fill="#050a05" />
  
  <rect class="panel" x=".5" y=".5" width="499" height="259" rx="3" />
  <text class="etiket" x="14" y="21">&gt; currently_learning</text>
  <line x1="0" y1="28" x2="500" y2="28" stroke="#1e3a20" stroke-width="1" />
  
    <text class="anahtar" x="16" y="60">&gt;_ React</text>
    <rect x="230" y="51" width="200" height="7" rx="3.5" fill="#1e3a20" />
    <rect x="230" y="51" width="140" height="7" rx="3.5" fill="#22c55e">
      <animate attributeName="width" from="0" to="140" dur="1.1s"
               fill="freeze" calcMode="spline" keySplines=".2 .7 .3 1"
               begin="0.00s" />
    </rect>
    <text class="deger" x="484" y="60" text-anchor="end">70%</text>
    <text class="anahtar" x="16" y="94">&gt;_ Node.js</text>
    <rect x="230" y="85" width="200" height="7" rx="3.5" fill="#1e3a20" />
    <rect x="230" y="85" width="120" height="7" rx="3.5" fill="#22c55e">
      <animate attributeName="width" from="0" to="120" dur="1.1s"
               fill="freeze" calcMode="spline" keySplines=".2 .7 .3 1"
               begin="0.12s" />
    </rect>
    <text class="deger" x="484" y="94" text-anchor="end">60%</text>
    <text class="anahtar" x="16" y="128">&gt;_ Firebase</text>
    <rect x="230" y="119" width="200" height="7" rx="3.5" fill="#1e3a20" />
    <rect x="230" y="119" width="160" height="7" rx="3.5" fill="#22c55e">
      <animate attributeName="width" from="0" to="160" dur="1.1s"
               fill="freeze" calcMode="spline" keySplines=".2 .7 .3 1"
               begin="0.24s" />
    </rect>
    <text class="deger" x="484" y="128" text-anchor="end">80%</text>
    <text class="anahtar" x="16" y="162">&gt;_ Backend</text>
    <rect x="230" y="153" width="200" height="7" rx="3.5" fill="#1e3a20" />
    <rect x="230" y="153" width="130" height="7" rx="3.5" fill="#22c55e">
      <animate attributeName="width" from="0" to="130" dur="1.1s"
               fill="freeze" calcMode="spline" keySplines=".2 .7 .3 1"
               begin="0.36s" />
    </rect>
    <text class="deger" x="484" y="162" text-anchor="end">65%</text>
  <text class="etiket" x="16" y="244" font-size="12">ferhat@github:~$ keep_learning.sh <tspan class="yanip">_</tspan></text>
</svg>
