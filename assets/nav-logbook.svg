<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="156" height="36" viewBox="0 0 156 36" role="img" aria-label="270° Logbook">
<title>270° Logbook</title>

  <defs><style>@font-face{font-family:FYMono;font-style:normal;font-weight:100 900;unicode-range:U+2c,U+2e,U+30-39,U+42,U+47,U+4b-4c,U+4f,U+b0,U+b7;src:url(data:font/woff2;base64,) format("woff2");}
  text { font-family: FYSans, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .serif { font-family: FYSerif, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-weight: 400; }
  .it { font-family: FYSerif, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style: italic; font-weight: 400; }
  .sans { font-family: FYSans, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: FYMono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .fa { font-family: FYFa, Vazirmatn, Tahoma, sans-serif; }
  .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .fade { animation: fade .9s ease-out backwards; }
  @keyframes fade { from { opacity: 0; } }
  .breathe { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .twinkle { animation: twinkle 3.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  .flow { animation: flow 2.4s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -24; } }
  .flow-r { animation: flowr 3.6s linear infinite; }
  @keyframes flowr { to { stroke-dashoffset: 24; } }
  .draw { animation: draw 1.6s cubic-bezier(.16,1,.3,1) backwards; }
  @keyframes draw { from { stroke-dashoffset: var(--len, 1000); } }
  
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style></defs>
  <rect x=".5" y=".5" width="155" height="35" rx="17.5" fill="#0a0a0c" stroke="#2e281b" />
  <circle cx="20" cy="18" r="10" fill="#1a1712" stroke="#2e281b" /><line x1="20" y1="12" x2="20" y2="8" stroke="#8c6a1e" stroke-width="1" /><line x1="25.3" y1="12.7" x2="27.1" y2="10.9" stroke="#8c6a1e" stroke-width="1" /><line x1="26" y1="18" x2="30" y2="18" stroke="#8c6a1e" stroke-width="1" /><line x1="25.3" y1="23.3" x2="27.1" y2="25.1" stroke="#8c6a1e" stroke-width="1" /><line x1="20" y1="24" x2="20" y2="28" stroke="#8c6a1e" stroke-width="1" /><line x1="14.7" y1="23.3" x2="12.9" y2="25.1" stroke="#8c6a1e" stroke-width="1" /><line x1="14" y1="18" x2="10" y2="18" stroke="#8c6a1e" stroke-width="1" /><line x1="14.7" y1="12.7" x2="12.9" y2="10.9" stroke="#8c6a1e" stroke-width="1" /><style>
    .n0 { transform-origin: 20px 18px; animation: n0 2.2s cubic-bezier(.3,1.4,.45,1) 1.1s backwards; }
    @keyframes n0 {
      0% { transform: rotate(-90deg); }
      45% { transform: rotate(9deg); }
      70% { transform: rotate(-3.5deg); }
      86% { transform: rotate(1.2deg); }
      100% { transform: rotate(0deg); }
    }</style><g class="n0 "><g transform="translate(11.5 9.5) scale(0.5313) rotate(270 16 16)">
    <path d="M16 2L19 16H13Z" fill="#ff7a45" />
    <path d="M16 2L16 16H13Z" fill="#ff7a45" fill-opacity=".66" />
    <path d="M13 16H19L16 29Z" fill="#d4a840" />
    <path d="M13 16H16L16 29Z" fill="#8c6a1e" />
    <circle cx="16" cy="16" r="2.6" fill="#d4a840" />
    <circle cx="16" cy="16" r=".95" fill="#ffd36e" />
  </g></g>
  <text class="mono" x="38" y="22.3" font-size="12" fill="#d4a840">270°</text>
  <text class="mono" x="74.8" y="22.3" font-size="12" letter-spacing="1.2" fill="#f7f0df">LOGBOOK</text>
</svg>
