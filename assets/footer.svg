<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-label="">
  <defs>
    <linearGradient id="fhat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0" />
      <stop offset=".2" stop-color="#d4af37" stop-opacity=".75" />
      <stop offset=".8" stop-color="#d4af37" stop-opacity=".75" />
      <stop offset="1" stop-color="#d4af37" stop-opacity="0" />
    </linearGradient>
    <mask id="fsonum">
      <rect width="1000" height="120" fill="url(#fhat)" />
    </mask>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: #070604; stroke: #d4af37; stroke-opacity: .3; stroke-width: 1; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }</style>
  </defs>
  <g mask="url(#fsonum)">
  <path id="fy0" d="M0 30 H300 V58 H620 V30 H1000" fill="none" stroke="#d4af37" stroke-opacity=".32" stroke-width="1.4" />
  <circle r="2.8" fill="#f5d76e" opacity="0">
    <animateMotion dur="9s" begin="0s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#fy0" xlink:href="#fy0" />
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1"
             dur="9s" begin="0s" repeatCount="indefinite" />
  </circle>
  <path id="fy1" d="M0 70 H180 V44 H420 V78 H760 V56 H1000" fill="none" stroke="#d4af37" stroke-opacity=".32" stroke-width="1.4" />
  <circle r="2.8" fill="#f5d76e" opacity="0">
    <animateMotion dur="12s" begin="1.4s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#fy1" xlink:href="#fy1" />
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1"
             dur="12s" begin="1.4s" repeatCount="indefinite" />
  </circle>
  <path id="fy2" d="M0 96 H520 V72 H840 V96 H1000" fill="none" stroke="#d4af37" stroke-opacity=".32" stroke-width="1.4" />
  <circle r="2.8" fill="#f5d76e" opacity="0">
    <animateMotion dur="10.5s" begin="2.8s" repeatCount="indefinite" calcMode="linear">
      <mpath href="#fy2" xlink:href="#fy2" />
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.88;1"
             dur="10.5s" begin="2.8s" repeatCount="indefinite" />
  </circle><rect x="297" y="55" width="6" height="6" fill="#d4af37" fill-opacity=".5" /><rect x="617" y="27" width="6" height="6" fill="#d4af37" fill-opacity=".5" /><rect x="177" y="41" width="6" height="6" fill="#d4af37" fill-opacity=".5" /><rect x="417" y="75" width="6" height="6" fill="#d4af37" fill-opacity=".5" /><rect x="757" y="53" width="6" height="6" fill="#d4af37" fill-opacity=".5" /><rect x="517" y="69" width="6" height="6" fill="#d4af37" fill-opacity=".5" /><rect x="837" y="93" width="6" height="6" fill="#d4af37" fill-opacity=".5" /></g>
  <rect x="0" y="110" width="1000" height="1.6" fill="url(#fhat)" />
</svg>
