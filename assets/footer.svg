<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="SYSTEM ONLINE - ziyaretin icin tesekkurler">
  <defs><style>
    text { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .panel { fill: #0a120b; stroke: #1e3a20; stroke-width: 1; }
    .etiket { font-size: 12px; fill: #4ade80; }
    .anahtar { font-size: 12.5px; fill: #6fbf78; }
    .deger { font-size: 12.5px; fill: #d4f5d6; }
    .kucuk { font-size: 11px; fill: #3d6b42; }
    .gir { animation: gir .6s ease-out backwards; }
    @keyframes gir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .yanip { animation: yanip 1.1s steps(1) infinite; }
    @keyframes yanip { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }</style></defs>
  <rect width="1000" height="90" fill="#050a05" />
  
  <rect class="panel" x=".5" y=".5" width="999" height="89" rx="3" />
  <line x1="0" y1="20" x2="1000" y2="20" stroke="#1e3a20" stroke-width="1" />
  
    <text class="etiket" x="20" y="40" font-size="14" font-weight="700">SYSTEM ONLINE</text>
    <text class="anahtar" x="20" y="62" font-size="12.5">Ugradigin icin tesekkurler.</text>
    <text class="kucuk" x="980" y="62" text-anchor="end">Bu sayfadaki kartlar bu depoda uretiliyor.</text>
    <circle cx="976" cy="34" r="4" fill="#22ff88">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
</svg>
