    <style>@font-face{font-family:FYMono;font-style:normal;font-weight:100 900;unicode-range:U+2c,U+2e,U+30-39,U+47-48,U+62,U+69,U+74-75,U+b0,U+b7;src:url(data:font/woff2;base64,) format("woff2");}
