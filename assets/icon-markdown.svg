<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="92" height="108" viewBox="0 0 92 108" role="img" aria-label="Markdown">
  <defs>
    
    <pattern id="iizg" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 H0 V36" fill="none" stroke="#d4af37" stroke-opacity=".06" stroke-width="1" />
    </pattern>
    <filter id="ih" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; }
    .card-bg { fill: #070604; stroke: #d4af37; stroke-opacity: .3; stroke-width: 1; }
    /* Her animasyon "backwards" ile kurulur: animasyon hic calismazsa
       ogenin dogal hali gecerli olur, yani icerik yine de gorunur. */
    .rise { animation: rise .7s cubic-bezier(.2,.7,.3,1) backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .01ms !important; animation-delay: 0s !important; }
    }
      .etk { font-size: 13px; font-weight: 600; fill: #f4ecd8; }
      /* Hareket bilincli sekilde hafif: sayfada baska seyler de oynuyor,
         ikonlar dikkati calmadan yasiyor olsun. */
      .bob { animation: bob 5s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
      .nabiz { animation: nabiz 4.5s ease-in-out infinite; }
      @keyframes nabiz { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .sallan { animation: sallan 5s ease-in-out infinite; }
      @keyframes sallan { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      .don { animation: don 22s linear infinite; }
      @keyframes don { to { transform: rotate(360deg); } }
      .alev { animation: alev 3s ease-in-out infinite; }
      @keyframes alev {
        0%,100% { transform: scale(1) rotate(-1.5deg); }
        50% { transform: scale(1.05) rotate(1.5deg); }
      }
      .isik { animation: isik 4.5s ease-in-out infinite; }
      @keyframes isik { 0%,100% { opacity: .05; } 50% { opacity: .16; } }
    </style>
  </defs>
  
  <rect class="card-bg" width="92" height="108" rx="4" />
  <rect width="92" height="108" rx="4" fill="url(#iizg)" />
  <rect x="10" y="10" width="5" height="5" fill="#d4af37" fill-opacity=".45" />
  <rect x="77" y="93" width="5" height="5" fill="#d4af37" fill-opacity=".45" />
  <g transform="translate(46 40)">
    <circle class="isik" r="24" fill="#dbdbdb" filter="url(#ih)" opacity=".1" />
    <g class="bob">
      <g class="nabiz">
        <g transform="translate(-20 -20) scale(1.6667)">
          <path d="M22.27 19.385H1.73A1.73 1.73 0 010 17.655V6.345a1.73 1.73 0 011.73-1.73h20.54A1.73 1.73 0 0124 6.345v11.308a1.73 1.73 0 01-1.73 1.731zM5.769 15.923v-4.5l2.308 2.885 2.307-2.885v4.5h2.308V8.078h-2.308l-2.307 2.885-2.308-2.885H3.46v7.847zM21.232 12h-2.309V8.077h-2.307V12h-2.308l3.461 4.039z" fill="#dbdbdb" />
        </g>
      </g>
    </g>
  </g>
  <text class="etk" x="46" y="90" text-anchor="middle">Markdown</text>
</svg>
