<svg xmlns="http://www.w3.org/2000/svg" width="92" height="108" viewBox="0 0 92 108" role="img" aria-label="Markdown">
  <defs>
    
    <linearGradient id="tbg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a1e07" stop-opacity="1" />
      <stop offset="0.42" stop-color="#0b0904" stop-opacity="1" />
      <stop offset="1" stop-color="#050403" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="tbg-kenar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe9a6" stop-opacity=".65" />
      <stop offset=".5" stop-color="#d4af37" stop-opacity=".45" />
      <stop offset="1" stop-color="#8c6a14" stop-opacity=".5" />
    </linearGradient>
    
    <linearGradient id="ig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" />
      <stop offset=".38" stop-color="#f5d76e" />
      <stop offset=".62" stop-color="#d4af37" />
      <stop offset="1" stop-color="#9a7415" />
    </linearGradient>
    <radialGradient id="ih"><stop offset="0" stop-color="#ffe27a" stop-opacity=".55" /><stop offset="1" stop-color="#ffe27a" stop-opacity="0" /></radialGradient>
    <style>
      .kutu { fill: url(#tbg); stroke: url(#tbg-kenar); stroke-width: 1.2; }
      .etk { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #c9ab5e; }
      /* Hareket bilincli sekilde hafif: sayfada baska seyler de oynuyor,
         ikonlar dikkati calmadan yasiyor olsun. */
      .bob { animation: bob 5s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(-1.5px); } to { transform: translateY(1.5px); } }
      .nabiz { animation: nabiz 4.5s ease-in-out infinite; }
      @keyframes nabiz { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      .sallan { animation: sallan 5s ease-in-out infinite; }
      @keyframes sallan { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
      .don { animation: don 22s linear infinite; }
      @keyframes don { to { transform: rotate(360deg); } }
      .alev { animation: alev 3s ease-in-out infinite; }
      @keyframes alev {
        0%,100% { transform: scale(1) rotate(-1.5deg); }
        50% { transform: scale(1.05) rotate(1.5deg); }
      }
      .isik { animation: isik 4.5s ease-in-out infinite; }
      @keyframes isik { 0%,100% { opacity: .35; } 50% { opacity: .8; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: .01ms !important; }
      }
    </style>
  </defs>
  <rect class="kutu" x="3" y="3" width="86" height="102" rx="18" />
  <g transform="translate(46 40)">
    <circle class="isik" r="30" fill="url(#ih)" />
    <g class="bob">
      <g class="nabiz">
        <g transform="translate(-20 -20) scale(1.6667)">
          <path d="M22.27 19.385H1.73A1.73 1.73 0 010 17.655V6.345a1.73 1.73 0 011.73-1.73h20.54A1.73 1.73 0 0124 6.345v11.308a1.73 1.73 0 01-1.73 1.731zM5.769 15.923v-4.5l2.308 2.885 2.307-2.885v4.5h2.308V8.078h-2.308l-2.307 2.885-2.308-2.885H3.46v7.847zM21.232 12h-2.309V8.077h-2.307V12h-2.308l3.461 4.039z" fill="url(#ig)" />
        </g>
      </g>
    </g>
  </g>
  <text class="etk" x="46" y="90" text-anchor="middle">Markdown</text>
</svg>
