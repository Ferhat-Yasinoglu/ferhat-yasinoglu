<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="Markdown">
  <defs>
    <filter id="h" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" />
