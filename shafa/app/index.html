<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Uygulama yalnız kendi dosyalarına ve kendi kökenine bağlanır. Hesap
     sunucusunun adresi belli olunca (senkron/sunucu-adresi.js) connect-src'ye
     TAM adresiyle eklenir; joker yok. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#f6fafd">
<meta name="description" content="شفا — نسخه‌نویسی و ثبت مریضان برای داکتر. معلومات تنها در همین دستگاه می‌ماند.">
<title data-i18n="uygulama.tam_ad">شفا — نسخه‌نویسی</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./img/logo.svg" type="image/svg+xml">
<!-- iOS manifest simgelerini kullanmıyor ve SVG kabul etmiyor: bu satır PNG
     olmazsa ana ekrana eklenen uygulamanın simgesi boş çıkıyor. -->
<link rel="apple-touch-icon" sizes="180x180" href="./img/logo-180.png">
<link rel="stylesheet" href="./css/tokenlar.css">
<link rel="stylesheet" href="./css/bilesenler.css">
<link rel="stylesheet" href="./css/uygulama.css">
<link rel="stylesheet" href="./css/yazdirma.css">
<script src="./js/cekirdek/tema.js"></script>
</head>
<body>
<header class="ust">
  <!-- Marka kenar çubuğundakinin aynısı: kalp+EKG çizimi (uygulama.js
       önüne ekliyor) ve Latin «Shafa». Yalnız telefonda görünüyor. -->
  <a class="ust__logo" href="#/recete/kagit">
    <span class="ust__ad" dir="ltr"><b>Shafa</b></span>
  </a>
  <div class="ust__ara" id="ust-ara"></div>
  <div class="ust__sag" id="ust-sag"></div>
</header>
<div class="govde">
  <div class="kenar-perde" id="kenar-perde" aria-hidden="true"></div>
<aside class="kenar" aria-label="Menü" data-i18n-label="nav.menu"><nav class="menu" id="kenar-menu"></nav></aside>
  <main class="icerik" id="icerik">
    <div class="bantlar" id="bantlar"></div>
    <div id="sayfa">
      <p class="js-gerekli" data-i18n="genel.js_gerekli">Bu uygulama JavaScript ile çalışır. Tarayıcında JavaScript kapalıysa aç ve sayfayı yenile.</p>
    </div>
  </main>
</div>
<footer class="alt-serit" id="alt-serit"></footer>
<nav class="alt" id="alt-cubuk" aria-label="Ana gezinme" data-i18n-label="nav.alt_cubuk"></nav>
<script type="module" src="./js/uygulama.js"></script>
</body>
</html>
