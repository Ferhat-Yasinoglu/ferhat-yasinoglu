[project]
name = "kazi"
version = "0.1.0"
description = "Kişisel kullanım için küçük bir Firecrawl benzeri: scrape, crawl, map, PDF, extract, search."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "trafilatura>=2.0", "pypdf>=6.0"]

[project.optional-dependencies]
js = ["playwright>=1.48"]
extract = ["anthropic>=1.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "anthropic>=1.0", "cryptography>=3.1", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
kazi = "kazi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kazi = ["static/*", "static/**/*"]
