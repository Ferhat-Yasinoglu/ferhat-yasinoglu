[project]
name = "kazi"
version = "0.1.0"
description = "Kişisel kullanım için küçük bir Firecrawl benzeri: scrape, crawl, map."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "trafilatura>=2.0"]

[project.optional-dependencies]
js = ["playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
kazi = "kazi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
